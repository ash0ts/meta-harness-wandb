[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mhforge-showcase"
version = "0.1.0"
description = "Stanford's Meta-Harness text-classification example instrumented with CoreWeave Forge"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
driver = ["pyyaml>=6"]
live = ["wandb==0.31.0", "cwevals==0.0.1b1", "coreweave==0.1.0b0", "cwsandbox[wandb]==1.27.0", "wandb-workspaces==0.4.13", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["mhforge*"]
