  </g>
  <g id="text_16">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #50565d" transform="translate(31.68 342.673047)">Each dot is a repeat; lines show observed ranges, not confidence intervals.</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #50565d" transform="translate(31.68 355.476523)">Macro scores weight USPTO (30), Symptom2Disease (50), and LawBench (50) equally.</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #50565d" transform="translate(31.68 368.28)">The loader shuffle used seed 42; no API seed was forwarded. Five repeats describe this study only.</text>
  </g>
